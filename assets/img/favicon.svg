<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <style>
    :root {
      --bar-fill: #0d1b2a;
      --line-stroke: #00875a;
      --node-fill: #0077b6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bar-fill: #ffffff;
        --line-stroke: #00e676;
        --node-fill: #00b4d8;
      }
    }
  </style>
  <g transform="translate(9, 3)">
    <!-- 3 Bar Chart Columns -->
    <rect x="25" y="116" width="36" height="62" rx="10" fill="var(--bar-fill)" />
    <rect x="77" y="103" width="35" height="75" rx="10" fill="var(--bar-fill)" />
    <rect x="130" y="61" width="34" height="117" rx="10" fill="var(--bar-fill)" />
    <!-- Upward Trend Line -->
    <path d="M 12 108 L 47 70 L 94 86 L 149 21" fill="none" stroke="var(--line-stroke)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Data Indicator Nodes -->
    <circle cx="47" cy="70" r="14" fill="var(--node-fill)" />
    <circle cx="150" cy="21" r="13" fill="var(--node-fill)" />
  </g>
</svg>
