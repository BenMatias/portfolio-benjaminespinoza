# Netlify Configuration
# Portfolio: Ben Matias — Business & Data Analyst

[build]
  publish = "."
  functions = "netlify/functions"

# Redirect /api/gemini-proxy to the Netlify function
[[redirects]]
  from = "/api/gemini-proxy"
  to = "/.netlify/functions/gemini-proxy"
  status = 200

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://scripts.clarity.ms https://*.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com https://www.google-analytics.com https://analytics.google.com https://*.clarity.ms https://*.google.com; frame-src 'self' https://lookerstudio.google.com https://datastudio.google.com https://*.google.com https://*.googleusercontent.com https://www.googletagmanager.com https://app.powerbi.com https://*.powerbi.com https://*.analysis.windows.net;"

# Serverless Functions Security & CORS
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://benmatias.com"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
